<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Mini Futebol</title>
<link rel="icon" href="/img/logo.svg" type="image/svg+xml">
<style>
  html,body{margin:0;height:100%;background:#06070d;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;display:grid;place-items:center}
  canvas{display:block;image-rendering:auto;outline:0}
</style>
</head>
<body>
<canvas id="c" width="800" height="480" tabindex="0" aria-label="Mini Futebol"></canvas>
<script>
/* Mini Futebol — jogo de futebol 2 contra 2 em HTML5. Licença MIT — (c) GameWeb.
   Controles: setas/WASD + Espaço/Z (chutar) · controle: analógico/direcional + A · toque: joystick + botão. */
(() => {
  'use strict';
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const W = 800, H = 480;
  const F = { l: 60, r: 740, t: 56, b: 440 };
  const CY = (F.t + F.b) / 2, GOAL_H = 136, GY0 = CY - GOAL_H / 2, GY1 = CY + GOAL_H / 2, GOAL_D = 30;
  const PR = 17, BR = 9, MATCH = 90;
  const TEAMS = [{ name: 'AZUL', c: '#4f7cff', d: '#2547c9' }, { name: 'VERMELHO', c: '#ff4f6a', d: '#c52a46' }];
  const rand = (a, b) => a + Math.random() * (b - a);
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  const S = { phase: 'menu', time: MATCH, score: [0, 0], players: [], ball: null, freeze: 0, last: -1, parts: [], shake: 0, touch: false, flash: 0, t: 0, kickReq: 0 };
  const keys = new Set();
  const pointers = new Map();
  let startLatch = false;

  /* ---------------------------------------------------------------- áudio */
  let ac = null;
  function tone(f, d = 0.08, type = 'square', vol = 0.06, slide = 0) {
    try {
      ac ??= new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f; if (slide) o.frequency.linearRampToValueAtTime(f + slide, ac.currentTime + d);
      g.gain.setValueAtTime(vol, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
    } catch { /* sem áudio */ }
  }
  const sfx = { kick: () => tone(180, 0.07, 'triangle', 0.12, -60), wall: () => tone(120, 0.05, 'sine', 0.05), whistle: () => { tone(880, 0.25, 'sine', 0.07); setTimeout(() => tone(990, 0.35, 'sine', 0.07), 180); }, goal: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.18, 'square', 0.07), i * 110)) };

  /* ---------------------------------------------------------------- partida */
  function mkPlayer(team, x, y, human) { return { x, y, vx: 0, vy: 0, r: PR, m: 3, team, human, a: team ? Math.PI : 0, cool: 0, skill: human ? 1 : 0.86 }; }
  function reset(kickoff = 0) {
    S.players = [mkPlayer(0, 300, CY, true), mkPlayer(0, 170, CY + 60, false), mkPlayer(1, 500, CY, false), mkPlayer(1, 630, CY - 60, false)];
    S.ball = { x: (F.l + F.r) / 2, y: CY, vx: 0, vy: 0, r: BR, m: 1, rot: 0 };
    if (kickoff === 1) S.players[2].x = 420;
  }
  function newMatch() { S.score = [0, 0]; S.time = MATCH; S.phase = 'play'; S.freeze = 0.9; reset(0); sfx.whistle(); }

  /* ---------------------------------------------------------------- entrada (teclado, controle, toque) */
  function readInput() {
    let x = 0, y = 0, kick = false, start = false; // start: apenas controle (o teclado usa evento)
    if (keys.has('ArrowLeft') || keys.has('KeyA')) x -= 1;
    if (keys.has('ArrowRight') || keys.has('KeyD')) x += 1;
    if (keys.has('ArrowUp') || keys.has('KeyW')) y -= 1;
    if (keys.has('ArrowDown') || keys.has('KeyS')) y += 1;
    kick = keys.has('Space') || keys.has('KeyZ') || keys.has('KeyX') || keys.has('KeyK') || S.kickReq > 0;
    const pad = (navigator.getGamepads ? [...navigator.getGamepads()] : []).find((p) => p && p.connected);
    if (pad) {
      const dz = (v) => (Math.abs(v) < 0.22 ? 0 : v);
      x += dz(pad.axes[0] || 0); y += dz(pad.axes[1] || 0);
      const b = (i) => pad.buttons[i] && (pad.buttons[i].pressed || pad.buttons[i].value > 0.5);
      if (b(14)) x -= 1; if (b(15)) x += 1; if (b(12)) y -= 1; if (b(13)) y += 1;
      kick = kick || b(0) || b(2) || b(5) || b(7);
      start = start || b(9) || b(8);
    }
    for (const p of pointers.values()) {
      if (p.kind === 'stick') { const dx = p.x - p.ox, dy = p.y - p.oy, d = Math.hypot(dx, dy); if (d > 8) { x += dx / Math.max(d, 50); y += dy / Math.max(d, 50); } }
      if (p.kind === 'kick') kick = true;
    }
    const m = Math.hypot(x, y);
    if (m > 1) { x /= m; y /= m; }
    return { x, y, kick, start };
  }
  // Enter/P/Esc e as teclas de chute são tratados no evento (toques rápidos não se perdem entre quadros)
  function startAction() {
    if (S.phase === 'menu' || S.phase === 'end') newMatch();
    else if (S.phase === 'play') S.phase = 'pause';
    else if (S.phase === 'pause') S.phase = 'play';
  }
  addEventListener('keydown', (e) => {
    keys.add(e.code);
    if (/^(Arrow|Space)/.test(e.code)) e.preventDefault();
    if (!e.repeat && ['Enter', 'KeyP', 'Escape'].includes(e.code)) startAction();
    if (!e.repeat && ['Space', 'KeyZ', 'KeyX', 'KeyK'].includes(e.code)) S.kickReq = 0.14;
  });
  addEventListener('keyup', (e) => keys.delete(e.code));
  addEventListener('blur', () => { keys.clear(); pointers.clear(); });
  const logical = (e) => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) }; };
  cv.addEventListener('pointerdown', (e) => {
    cv.focus(); const p = logical(e);
    if (e.pointerType === 'touch') S.touch = true;
    if (p.x > W - 60 && p.y < 54 && S.phase === 'play') { S.phase = 'pause'; return; }
    if (S.phase === 'menu' || S.phase === 'end') { newMatch(); return; }
    if (S.phase === 'pause') { S.phase = 'play'; return; }
    cv.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, p.x < W / 2 ? { kind: 'stick', ox: p.x, oy: p.y, x: p.x, y: p.y } : { kind: 'kick' });
  });
  cv.addEventListener('pointermove', (e) => { const q = pointers.get(e.pointerId); if (q && q.kind === 'stick') { const p = logical(e); q.x = p.x; q.y = p.y; } });
  for (const t of ['pointerup', 'pointercancel']) cv.addEventListener(t, (e) => pointers.delete(e.pointerId));

  /* ---------------------------------------------------------------- física */
  function move(p, ix, iy, dt) {
    const sp = 215 * (p.skill || 1);
    p.vx += (ix * sp - p.vx) * Math.min(1, dt * 9);
    p.vy += (iy * sp - p.vy) * Math.min(1, dt * 9);
    p.x = clamp(p.x + p.vx * dt, F.l + p.r, F.r - p.r);
    p.y = clamp(p.y + p.vy * dt, F.t + p.r, F.b - p.r);
    if (Math.hypot(p.vx, p.vy) > 25) p.a = Math.atan2(p.vy, p.vx);
  }
  function kickBall(p, dx, dy, power) {
    const b = S.ball, d = Math.hypot(dx, dy) || 1;
    b.vx = (dx / d) * 540 * power + p.vx * 0.35; b.vy = (dy / d) * 540 * power + p.vy * 0.35;
    p.cool = 0.28; S.shake = 3; sfx.kick();
  }
  function collide(a, b, e) {
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = a.r + b.r;
    if (!d || d >= min) return false;
    const nx = dx / d, ny = dy / d, o = min - d, tm = a.m + b.m;
    if (!a.fixed) { a.x -= nx * o * (b.m / tm); a.y -= ny * o * (b.m / tm); }
    b.x += nx * o * (a.fixed ? 1 : a.m / tm); b.y += ny * o * (a.fixed ? 1 : a.m / tm);
    const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
    if (rv < 0) {
      const j = -(1 + e) * rv / ((a.fixed ? 0 : 1 / a.m) + 1 / b.m);
      if (!a.fixed) { a.vx -= (j * nx) / a.m; a.vy -= (j * ny) / a.m; }
      b.vx += (j * nx) / b.m; b.vy += (j * ny) / b.m;
    }
    return true;
  }
  const posts = [[F.l, GY0], [F.l, GY1], [F.r, GY0], [F.r, GY1]].map(([x, y]) => ({ x, y, r: 5, m: 1e6, vx: 0, vy: 0, fixed: true }));

  function ai(p, dt) {
    const b = S.ball, goalX = p.team ? F.l : F.r, ownX = p.team ? F.r : F.l;
    const mates = S.players.filter((q) => q.team === p.team && !q.human);
    const chaser = S.players.filter((q) => q.team === p.team).reduce((a, q) => (dist(q, b) < dist(a, b) ? q : a));
    let tx, ty;
    if (p === chaser) {
      const gx = goalX - b.x, gy = CY - b.y, gl = Math.hypot(gx, gy) || 1;
      const bx = b.x - (gx / gl) * (PR + BR + 6), by = b.y - (gy / gl) * (PR + BR + 6);
      const near = dist(p, b) < PR + BR + 14;
      tx = near ? b.x : bx; ty = near ? b.y : by;
      if (dist(p, b) < PR + BR + 9 && p.cool <= 0 && Math.random() < dt * 7) kickBall(p, goalX - b.x, CY + rand(-GOAL_H * 0.32, GOAL_H * 0.32) - b.y, rand(0.8, 1));
    } else {
      tx = ownX + (b.x - ownX) * 0.5; ty = CY + (b.y - CY) * 0.55;
      if (mates.length === 1 && p === mates[0]) { tx = ownX + (b.x - ownX) * 0.42; }
    }
    const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
    move(p, d > 8 ? dx / d : 0, d > 8 ? dy / d : 0, dt);
  }

  function goal(team) {
    S.score[team]++; S.phase = 'goal'; S.freeze = 2.4; S.last = team; S.flash = 1; sfx.goal();
    S.ball.vx *= 0.4; S.ball.vy *= 0.4;
    for (let i = 0; i < 90; i++) S.parts.push({ x: team ? F.l : F.r, y: CY, vx: rand(-260, 260), vy: rand(-340, 60), life: rand(1.2, 2.4), c: Math.random() < 0.5 ? TEAMS[team].c : '#ffd43b', s: rand(3, 7) });
  }

  function update(dt) {
    S.t += dt;
    const inp = readInput();
    S.kickReq = Math.max(0, S.kickReq - dt);
    if (inp.start && !startLatch) { startLatch = true; startAction(); } else if (!inp.start) startLatch = false;
    for (const p of S.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 520 * dt; p.life -= dt; }
    S.parts = S.parts.filter((p) => p.life > 0);
    S.shake = Math.max(0, S.shake - dt * 20); S.flash = Math.max(0, S.flash - dt * 1.6);
    if (S.phase === 'menu' || S.phase === 'pause' || S.phase === 'end') return;
    if (S.phase === 'goal') {
      // a bola desliza dentro da rede e para
      const b = S.ball;
      b.x = clamp(b.x + b.vx * dt, F.l - GOAL_D + BR, F.r + GOAL_D - BR); b.y = clamp(b.y + b.vy * dt, GY0 + BR, GY1 - BR);
      const k = Math.pow(0.05, dt); b.vx *= k; b.vy *= k;
      S.freeze -= dt;
      if (S.freeze <= 0) { reset(S.last === 0 ? 1 : 0); S.phase = 'play'; S.freeze = 0.8; sfx.whistle(); }
      return;
    }
    if (S.freeze > 0) { S.freeze -= dt; return; }
    const [h] = S.players;
    move(h, inp.x, inp.y, dt);
    const b = S.ball;
    if (inp.kick && h.cool <= 0 && dist(h, b) < PR + BR + 11) {
      let dx = b.x - h.x, dy = b.y - h.y; const d = Math.hypot(dx, dy) || 1;
      dx = dx / d + inp.x * 0.8; dy = dy / d + inp.y * 0.8;
      kickBall(h, dx, dy, 1);
    }
    for (const p of S.players) { p.cool = Math.max(0, p.cool - dt); if (!p.human) ai(p, dt); }
    b.x += b.vx * dt; b.y += b.vy * dt;
    const damp = Math.pow(0.45, dt); b.vx *= damp; b.vy *= damp;
    b.rot += (Math.hypot(b.vx, b.vy) * dt) / BR;
    const ps = S.players;
    for (let i = 0; i < ps.length; i++) {
      for (let j = i + 1; j < ps.length; j++) collide(ps[i], ps[j], 0.25);
      if (collide(ps[i], b, 0.6) && Math.hypot(b.vx, b.vy) > 160) sfx.wall();
    }
    for (const q of posts) if (collide(q, b, 0.7)) sfx.wall();
    // paredes e gols
    if (b.y < F.t + BR) { b.y = F.t + BR; b.vy = Math.abs(b.vy) * 0.8; }
    if (b.y > F.b - BR) { b.y = F.b - BR; b.vy = -Math.abs(b.vy) * 0.8; }
    const inMouth = b.y > GY0 && b.y < GY1;
    if (b.x < F.l || b.x > F.r) { // dentro da área do gol
      b.y = clamp(b.y, GY0 + BR, GY1 - BR);
      if (b.x < F.l - GOAL_D + BR) { b.x = F.l - GOAL_D + BR; b.vx = Math.abs(b.vx) * 0.3; }
      if (b.x > F.r + GOAL_D - BR) { b.x = F.r + GOAL_D - BR; b.vx = -Math.abs(b.vx) * 0.3; }
    } else if (!inMouth || b.x < F.l + BR || b.x > F.r - BR) {
      if (!inMouth) { if (b.x < F.l + BR) { b.x = F.l + BR; b.vx = Math.abs(b.vx) * 0.8; } if (b.x > F.r - BR) { b.x = F.r - BR; b.vx = -Math.abs(b.vx) * 0.8; } }
    }
    if (b.x < F.l - 4) goal(1); else if (b.x > F.r + 4) goal(0);
    S.time -= dt;
    if (S.time <= 0) { S.time = 0; S.phase = 'end'; sfx.whistle(); }
  }

  /* ---------------------------------------------------------------- desenho */
  function pitch() {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0a1a12'); g.addColorStop(1, '#06100b');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const sw = (F.r - F.l) / 14;
    for (let i = 0; i < 14; i++) { ctx.fillStyle = i % 2 ? '#2f9e44' : '#37b24d'; ctx.fillRect(F.l + i * sw, F.t, sw + 1, F.b - F.t); }
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 3; ctx.strokeRect(F.l, F.t, F.r - F.l, F.b - F.t);
    ctx.beginPath(); ctx.moveTo((F.l + F.r) / 2, F.t); ctx.lineTo((F.l + F.r) / 2, F.b); ctx.stroke();
    ctx.beginPath(); ctx.arc((F.l + F.r) / 2, CY, 56, 0, 7); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc((F.l + F.r) / 2, CY, 4, 0, 7); ctx.fill();
    for (const s of [0, 1]) { ctx.strokeRect(s ? F.r - 110 : F.l, CY - 90, 110, 180); ctx.strokeRect(s ? F.r - 46 : F.l, CY - 50, 46, 100);
      // trave e rede
      ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(s ? F.r : F.l - GOAL_D, GY0, GOAL_D, GOAL_H);
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1;
      for (let k = 0; k <= GOAL_D; k += 6) { ctx.beginPath(); ctx.moveTo((s ? F.r : F.l - GOAL_D) + k, GY0); ctx.lineTo((s ? F.r : F.l - GOAL_D) + k, GY1); ctx.stroke(); }
      for (let k = 0; k <= GOAL_H; k += 8) { ctx.beginPath(); ctx.moveTo(s ? F.r : F.l - GOAL_D, GY0 + k); ctx.lineTo((s ? F.r : F.l - GOAL_D) + GOAL_D, GY0 + k); ctx.stroke(); }
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.strokeRect(s ? F.r : F.l - GOAL_D, GY0, GOAL_D, GOAL_H); ctx.lineWidth = 3; }
    ctx.strokeStyle = 'rgba(255,255,255,.85)';
  }
  function player(p) {
    const T = TEAMS[p.team];
    ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(p.x + 3, p.y + 7, p.r, p.r * 0.7, 0, 0, 7); ctx.fill();
    const g = ctx.createRadialGradient(p.x - 5, p.y - 6, 2, p.x, p.y, p.r + 2); g.addColorStop(0, T.c); g.addColorStop(1, T.d);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#ffd9b3'; ctx.beginPath(); ctx.arc(p.x + Math.cos(p.a) * 6, p.y + Math.sin(p.a) * 6, 6.5, 0, 7); ctx.fill();
    if (p.human) {
      ctx.strokeStyle = '#ffd43b'; ctx.lineWidth = 2.5; ctx.setLineDash([5, 4]); ctx.lineDashOffset = -S.t * 18; ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 7, 0, 7); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#ffd43b'; ctx.beginPath(); ctx.moveTo(p.x, p.y - p.r - 18); ctx.lineTo(p.x - 6, p.y - p.r - 28); ctx.lineTo(p.x + 6, p.y - p.r - 28); ctx.fill();
    }
  }
  function ball() {
    const b = S.ball;
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(b.x + 2, b.y + 5, BR, BR * 0.65, 0, 0, 7); ctx.fill();
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, BR, 0, 7); ctx.fill();
    ctx.fillStyle = '#222'; ctx.beginPath(); for (let k = 0; k < 5; k++) { const a = (k / 5) * 6.2832; ctx.lineTo(Math.cos(a) * 4, Math.sin(a) * 4); } ctx.fill();
    ctx.strokeStyle = '#444'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(0, 0, BR, 0, 7); ctx.stroke(); ctx.restore();
  }
  const txt = (s, x, y, size, color = '#fff', align = 'center', weight = 800) => { ctx.font = `${weight} ${size}px system-ui, "Segoe UI", sans-serif`; ctx.textAlign = align; ctx.fillStyle = color; ctx.fillText(s, x, y); };
  function hud() {
    ctx.fillStyle = 'rgba(8,10,20,.82)'; ctx.beginPath(); ctx.roundRect(W / 2 - 150, 8, 300, 40, 20); ctx.fill();
    ctx.fillStyle = TEAMS[0].c; ctx.beginPath(); ctx.roundRect(W / 2 - 146, 12, 62, 32, 16); ctx.fill();
    ctx.fillStyle = TEAMS[1].c; ctx.beginPath(); ctx.roundRect(W / 2 + 84, 12, 62, 32, 16); ctx.fill();
    txt(S.score[0], W / 2 - 115, 37, 24); txt(S.score[1], W / 2 + 115, 37, 24);
    const t = Math.ceil(S.time); txt(`${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`, W / 2, 37, 22);
    txt('AZUL', 28, 34, 14, TEAMS[0].c, 'left'); txt('VERMELHO', W - 72, 34, 14, TEAMS[1].c, 'right');
    if (S.phase === 'play' || S.phase === 'pause') { ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.beginPath(); ctx.roundRect(W - 52, 10, 38, 34, 10); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(W - 41, 20, 5, 14); ctx.fillRect(W - 30, 20, 5, 14); }
  }
  function overlay(title, sub, sub2) {
    ctx.fillStyle = 'rgba(5,7,14,.72)'; ctx.fillRect(0, 0, W, H);
    const g = ctx.createLinearGradient(W / 2 - 220, 0, W / 2 + 220, 0); g.addColorStop(0, '#7c5cff'); g.addColorStop(0.55, '#22d3ee'); g.addColorStop(1, '#ff4fa3');
    txt(title, W / 2, 190 + Math.sin(S.t * 2) * 4, 62, g);
    txt(sub, W / 2, 245, 22, '#dfe3ff', 'center', 600); if (sub2) txt(sub2, W / 2, 280, 16, '#9aa1c7', 'center', 500);
  }
  function touchUI() {
    if (!S.touch) return;
    for (const p of pointers.values()) if (p.kind === 'stick') {
      ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p.ox, p.oy, 50, 0, 7); ctx.stroke();
      const dx = p.x - p.ox, dy = p.y - p.oy, d = Math.min(50, Math.hypot(dx, dy)), a = Math.atan2(dy, dx);
      ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(p.ox + Math.cos(a) * d, p.oy + Math.sin(a) * d, 24, 0, 7); ctx.fill();
    }
    ctx.fillStyle = [...pointers.values()].some((p) => p.kind === 'kick') ? 'rgba(255,212,59,.6)' : 'rgba(255,255,255,.18)';
    ctx.beginPath(); ctx.arc(W - 84, H - 70, 44, 0, 7); ctx.fill(); txt('CHUTE', W - 84, H - 64, 15, '#fff');
  }
  function draw() {
    ctx.save();
    if (S.shake) ctx.translate(rand(-S.shake, S.shake), rand(-S.shake, S.shake));
    pitch();
    if (S.ball) { ball(); S.players.forEach(player); }
    for (const p of S.parts) { ctx.globalAlpha = clamp(p.life, 0, 1); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.s, p.s); }
    ctx.globalAlpha = 1;
    ctx.restore();
    hud(); touchUI();
    if (S.flash) { ctx.fillStyle = `rgba(255,255,255,${S.flash * 0.35})`; ctx.fillRect(0, 0, W, H); }
    if (S.phase === 'goal') txt('GOOOL!', W / 2, CY + 20, 96 + Math.sin(S.t * 14) * 6, TEAMS[S.last].c);
    if (S.phase === 'menu') overlay('MINI FUTEBOL', 'Pressione Enter, A (controle) ou toque para jogar', 'Setas/WASD mover · Espaço/Z chutar · P pausa  |  Controle: analógico + A  |  Toque: joystick + botão');
    if (S.phase === 'pause') overlay('PAUSADO', 'Pressione P, Esc ou Start para continuar');
    if (S.phase === 'end') overlay(S.score[0] > S.score[1] ? 'VITÓRIA!' : S.score[0] < S.score[1] ? 'DERROTA' : 'EMPATE', `${S.score[0]} x ${S.score[1]}`, 'Pressione Enter, A ou toque para jogar de novo');
  }

  /* ---------------------------------------------------------------- laço principal e escala */
  function fit() { const k = Math.min(innerWidth / W, innerHeight / H); cv.style.width = W * k + 'px'; cv.style.height = H * k + 'px'; }
  addEventListener('resize', fit); fit();
  reset(0);
  let prev = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__mf = S; // útil para testes automatizados
})();
</script>
</body>
</html>
